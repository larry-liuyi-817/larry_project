# 工作流名称（会显示在 GitHub Actions 页面上）
name: workflow for learn

# 触发条件：手动触发 + 推送到 main 分支时自动运行
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动点击运行

# 任务集合
jobs:
  # ==================== Job 1：系统基础信息 ====================
  job1_check_system:
    name: 检查系统信息
    runs-on: ubuntu-latest  # 运行环境：Ubuntu最新版

    steps:
      - name: 步骤1 - 打印操作系统信息
        run: |
          echo "========== 系统信息 =========="
          cat /etc/os-release
          uname -a

      - name: 步骤2 - 打印当前登录用户
        run: |
          echo "当前用户：$USER"
          whoami

      - name: 步骤3 - 打印磁盘与内存
        run: |
          echo "========== 磁盘信息 =========="
          df -h
          echo "========== 内存信息 =========="
          free -h

  # ==================== Job 2：GitHub 环境变量 ====================
  job2_check_github_vars:
    name: 查看 GitHub 内置变量
    runs-on: ubuntu-latest
    needs: job1_check_system  # 让这个 job 在 job1 完成后再运行（学习依赖关系）

    steps:
      - name: 步骤1 - 打印仓库信息
        run: |
          echo "仓库名称： ${{ github.repository }}"
          echo "触发分支： ${{ github.ref }}"
          echo "提交SHA：  ${{ github.sha }}"
          echo "工作空间： ${{ github.workspace }}"

      - name: 步骤2 - 打印运行器信息
        run: |
          echo "运行器 OS： ${{ runner.os }}"
          echo "运行器名称： ${{ runner.name }}"

  # ==================== Job 3：脚本与环境测试 ====================
  job3_test_shell:
    name: 测试 Shell 脚本
    runs-on: ubuntu-latest
    needs: []  # 不依赖任何 job，与 job1 并行运行

    steps:
      - name: 步骤1 - 打印时间与路径
        run: |
          echo "当前时间：$(date)"
          echo "当前路径：$PWD"
          echo "HOME 目录：$HOME"

      - name: 步骤2 - 打印 GitHub 令牌状态
        run: |
          echo "GITHUB_TOKEN 是否存在：${{ secrets.GITHUB_TOKEN != '' }}"

# 工作流名称（会显示在 GitHub Actions 页面上）
name: workflow for learn
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  job1_check_system:
    name: 检查系统信息
    runs-on: ubuntu-latest
    steps:
      - name: 步骤1 - 打印操作系统信息
        run: |
          echo "========== 系统信息 =========="
          cat /etc/os-release
          uname -a
      - name: 步骤2 - 打印当前登录用户
        run: |
          echo "当前用户：$USER"
          whoami
      - name: 步骤3 - 打印磁盘与内存
        run: |
          echo "========== 磁盘信息 =========="
          df -h
          echo "========== 内存信息 =========="
          free -h
  job2_check_github_vars:
    name: 查看 GitHub 内置变量
    runs-on: ubuntu-latest
    needs: job1_check_system
    steps:
      - name: 步骤1 - 打印仓库信息
        run: |
          echo "仓库名称： ${{ github.repository }}"
          echo "触发分支： ${{ github.ref }}"
          echo "提交SHA：  ${{ github.sha }}"
          echo "工作空间： ${{ github.workspace }}"
      - name: 步骤2 - 打印运行器信息
        run: |
          echo "运行器 OS： ${{ runner.os }}"
          echo "运行器名称： ${{ runner.name }}"
  job3_test_shell:
    name: 测试 Shell 脚本
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: 步骤1 - 打印时间与路径
        run: |
          echo "当前时间：$(date)"
          echo "当前路径：$PWD"
          echo "HOME 目录：$HOME"
      - name: 步骤2 - 打印 GitHub 令牌状态
        run: |
          echo "GITHUB_TOKEN 是否存在：${{ secrets.GITHUB_TOKEN != '' }}"
      - name: 下载代码
        uses: actions/checkout@v6
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: test my action
        uses: ./.github/actions/show-json-action
        with:
          ak: "xxx"
          sk: "xxx"
          soc_version: "v900"
